name: Draft source v0.5 exact-stack proof

on:
  push:
    branches:
      - proof/draft-source-v05-exact-stack0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-stack-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout extension under test
        uses: actions/checkout@v4
        with:
          repository: thelaplage/counterpedia-extension
          ref: ccb67c3d1e3eeea1ff1aac587d86f4d4ed6590c4
          path: extension

      - name: Checkout Acquisition exact pin
        uses: actions/checkout@v4
        with:
          repository: thelaplage/counterpedia-acquisition
          ref: bf518d963818fcacd1d3c3cf10c7234c9faf3a7e
          path: acquisition

      - name: Checkout Authoring exact pin
        uses: actions/checkout@v4
        with:
          repository: thelaplage/counterpedia-authoring
          ref: d9cbe93ae22528f500f55389d3cf1577eeae04e3
          path: authoring

      - name: Checkout Counterpedia exact pin
        uses: actions/checkout@v4
        with:
          repository: thelaplage/counterpedia
          ref: d18fe615bd1d638448e16b94e8155dc4f120aeaf
          path: counterpedia

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            counterpedia/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            authoring/pyproject.toml
            acquisition/pyproject.toml

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Install Counterpedia dependencies
        working-directory: counterpedia
        run: npm ci

      - name: Build Counterpedia workspace packages used by reader dev server
        working-directory: counterpedia
        run: npm run build:sdk-mcp

      - name: Install exact Authoring and Acquisition Python runtime
        shell: bash
        run: |
          python -m venv authoring/.venv
          authoring/.venv/bin/python -m pip install --upgrade pip
          authoring/.venv/bin/python -m pip install -e './authoring[dev,mcp]' -e './acquisition[mcp]'

      - name: Focused Authoring v0.5 finalizer proof
        run: >-
          authoring/.venv/bin/python -m pytest
          authoring/tests/test_draft_source_v05_finalize0.py
          authoring/tests/test_live_source_http.py
          -q

      - name: Focused extension v0.5 activation proof
        working-directory: extension
        run: npx vitest run tests/draftSourceV05Activation.test.ts

      - name: Literal exact-pinned four-repository product gate
        working-directory: extension
        env:
          COUNTERPEDIA_ACQUISITION_DIR: ${{ github.workspace }}/acquisition
          COUNTERPEDIA_AUTHORING_DIR: ${{ github.workspace }}/authoring
          COUNTERPEDIA_DIR: ${{ github.workspace }}/counterpedia
          COUNTERPEDIA_AUTHORING_PYTHON: ${{ github.workspace }}/authoring/.venv/bin/python
          COUNTERPEDIA_EXTENSION_EXPECTED_HEAD: ccb67c3d1e3eeea1ff1aac587d86f4d4ed6590c4
          COUNTERPEDIA_ACQUISITION_EXPECTED_HEAD: bf518d963818fcacd1d3c3cf10c7234c9faf3a7e
          COUNTERPEDIA_AUTHORING_EXPECTED_HEAD: d9cbe93ae22528f500f55389d3cf1577eeae04e3
          COUNTERPEDIA_EXPECTED_HEAD: d18fe615bd1d638448e16b94e8155dc4f120aeaf
        run: bash scripts/draft-e2e-gate.sh
