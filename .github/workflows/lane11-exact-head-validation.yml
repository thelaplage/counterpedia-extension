name: Lane 11 exact-head validation

on:
  push:
    branches:
      - agent/wiki-session-persistence0-validation
  pull_request:
    branches:
      - agent/wiki-session-persistence0-validation

permissions:
  contents: read

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main lint baseline
        uses: actions/checkout@v4
        with:
          ref: 12e2b91eace6b7587b85c32ea25749f4baf0a2cc
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Capture main TypeScript baseline
        run: |
          set +e
          npm run lint > /tmp/main-lint.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/main-lint.rc
          grep -E 'error TS[0-9]+:' /tmp/main-lint.log | sort > /tmp/main-lint.errors || true
          echo "main lint exit=$rc"
          cat /tmp/main-lint.errors

      - name: Checkout exact Lane 11 candidate
        uses: actions/checkout@v4
        with:
          ref: 86f2eba4a9951db8702331bccc821684bfbd4634
          fetch-depth: 0

      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "86f2eba4a9951db8702331bccc821684bfbd4634"
          git status --short --branch
          git diff --check 12e2b91eace6b7587b85c32ea25749f4baf0a2cc HEAD

      - name: Install candidate dependencies
        run: npm ci

      - name: Focused Lane 11 tests
        run: |
          npx vitest run \
            tests/governedSourceSelection.test.ts \
            tests/wikipediaFrontierCapture.test.ts \
            tests/wikipediaSessionPersistence.test.ts \
            tests/wikipediaCaptureAuthoringBoundary.test.ts \
            tests/draftFromSourceButton.test.ts

      - name: Full test suite
        run: npm test

      - name: TypeScript differential gate
        run: |
          set +e
          npm run lint > /tmp/candidate-lint.log 2>&1
          rc=$?
          set -e
          grep -E 'error TS[0-9]+:' /tmp/candidate-lint.log | sort > /tmp/candidate-lint.errors || true
          echo "main lint exit=$(cat /tmp/main-lint.rc); candidate lint exit=$rc"
          echo "Candidate diagnostics:"
          cat /tmp/candidate-lint.errors
          new_diagnostics="$(comm -13 /tmp/main-lint.errors /tmp/candidate-lint.errors)"
          if [ -n "$new_diagnostics" ]; then
            echo "Lane 11 introduces new TypeScript diagnostics:" >&2
            printf '%s\n' "$new_diagnostics" >&2
            exit 1
          fi
          removed_diagnostics="$(comm -23 /tmp/main-lint.errors /tmp/candidate-lint.errors)"
          if [ -n "$removed_diagnostics" ]; then
            echo "Lane 11 removes baseline TypeScript diagnostics:"
            printf '%s\n' "$removed_diagnostics"
          fi
          echo "Lane 11 introduces zero TypeScript diagnostics beyond main baseline."

      - name: Authoring-dev build gate
        run: npm run build:authoring-dev

      - name: Inspect built manifest
        run: |
          test -f dist/manifest.json
          node -e 'const m=require("./dist/manifest.json"); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version, m.manifest_version)'

      - name: Install supported extension E2E harness
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: npm install --no-save --no-package-lock puppeteer@25.5.0

      - name: Real Chrome process-restart recovery probe
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: |
          set -euo pipefail

          cat > dist/lifecycle-probe.html <<'EOF'
          <!doctype html>
          <html><body>PENDING<script type="module" src="lifecycle-probe.js"></script></body></html>
          EOF

          cat > dist/lifecycle-probe.js <<'EOF'
          const KEY = "counterpedia_governed_source_selection_v0_1";
          const digest = "sha256:" + "a".repeat(64);
          const source = {
            tool: "acquisition.capture_url",
            surface_schema: "acquisition.mcp_surface.v0.1",
            capture_status: "captured",
            capture_id: "cap_restart_probe",
            source_id: "src_restart_probe",
            source_locator: "https://example.org/restart-proof",
            captured_object_address: digest,
            byte_count: 123,
            failure_detail: null,
            capture_receipt: {
              capture_id: "cap_restart_probe",
              source_id: "src_restart_probe",
              source_locator: "https://example.org/restart-proof",
              exact_bytes_sha256: digest,
              byte_count: 123
            }
          };
          const mode = new URL(location.href).searchParams.get("mode");
          if (mode === "write") {
            await chrome.storage.local.set({
              [KEY]: {
                schema_version: "counterpedia.governed_source_selection.v0.1",
                selected_at: "2026-08-19T02:00:00.000Z",
                source,
                retention: "LOCAL_ONLY",
                authority_posture: "selection_only"
              }
            });
            document.body.textContent = "WRITE_OK";
          } else if (mode === "read") {
            const stored = (await chrome.storage.local.get(KEY))[KEY];
            document.body.textContent = stored?.source?.capture_id === "cap_restart_probe" ? "READ_OK" : "READ_FAILED";
          } else {
            document.body.textContent = "UNKNOWN_MODE";
          }
          EOF

          cat > /tmp/lane11-restart-probe.mjs <<'EOF'
          import puppeteer from 'puppeteer';
          import path from 'node:path';
          import fs from 'node:fs';

          const dist = path.resolve(process.cwd(), 'dist');
          const profile = path.join(process.env.RUNNER_TEMP, 'lane11-puppeteer-profile');
          fs.rmSync(profile, {recursive: true, force: true});

          const launch = () => puppeteer.launch({
            headless: true,
            userDataDir: profile,
            enableExtensions: [dist],
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          async function findCounterpedia(browser) {
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const extensions = await browser.extensions();
              for (const extension of extensions.values()) {
                if (
                  extension.name === 'Counterpedia (Draft-from-source Dev)' ||
                  path.resolve(extension.path) === dist
                ) {
                  return extension;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 200));
            }
            const extensions = await browser.extensions();
            throw new Error(`Counterpedia extension not loaded; saw: ${[...extensions.values()].map(e => `${e.name}:${e.id}:${e.path}`).join(', ')}`);
          }

          async function openExtensionPage(browser, url, expected) {
            const page = await browser.newPage();
            await page.goto(url, {waitUntil: 'domcontentloaded'});
            await page.waitForFunction(
              expectedText => document.body.textContent?.includes(expectedText),
              {timeout: 10000},
              expected,
            );
            const text = await page.evaluate(() => document.body.textContent ?? '');
            if (!text.includes(expected)) {
              throw new Error(`Expected ${expected}, got ${text}`);
            }
            await page.close();
          }

          console.log('Launching first real Chrome-for-Testing process');
          const first = await launch();
          const firstExtension = await findCounterpedia(first);
          const extensionId = firstExtension.id;
          console.log(`Loaded extension ${firstExtension.name} ${extensionId}`);
          await openExtensionPage(
            first,
            `chrome-extension://${extensionId}/lifecycle-probe.html?mode=write`,
            'WRITE_OK',
          );
          await first.close();
          console.log('First browser process closed after durable local write');

          console.log('Launching second real Chrome-for-Testing process with same profile');
          const second = await launch();
          const secondExtension = await findCounterpedia(second);
          if (secondExtension.id !== extensionId) {
            throw new Error(`Extension ID changed across restart: ${extensionId} -> ${secondExtension.id}`);
          }
          await openExtensionPage(
            second,
            `chrome-extension://${extensionId}/lifecycle-probe.html?mode=read`,
            'READ_OK',
          );

          const panel = await second.newPage();
          await panel.goto(`chrome-extension://${extensionId}/panel/index.html`, {
            waitUntil: 'domcontentloaded',
          });
          const expectedRecovery = 'Draft-source selection recovered locally · cap_restart_probe';
          await panel.waitForFunction(
            expectedText => document.body.textContent?.includes(expectedText),
            {timeout: 15000},
            expectedRecovery,
          );
          const panelText = await panel.evaluate(() => document.body.textContent ?? '');
          if (!panelText.includes(expectedRecovery)) {
            throw new Error(`Actual panel did not render recovery state: ${panelText}`);
          }
          console.log('Actual built panel restored and rendered persisted selection after browser process restart');
          await second.close();
          console.log('REAL_CHROME_RESTART_RECOVERY_OK');
          EOF

          node /tmp/lane11-restart-probe.mjs
