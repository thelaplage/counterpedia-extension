name: Lane 11 exact-head validation

on:
  push:
    branches:
      - agent/wiki-session-persistence0-validation
  pull_request:
    branches:
      - agent/wiki-session-persistence0-validation

permissions:
  contents: read

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main lint baseline
        uses: actions/checkout@v4
        with:
          ref: 12e2b91eace6b7587b85c32ea25749f4baf0a2cc
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Capture main TypeScript baseline
        run: |
          set +e
          npm run lint > /tmp/main-lint.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/main-lint.rc
          grep -E 'error TS[0-9]+:' /tmp/main-lint.log | sort > /tmp/main-lint.errors || true
          echo "main lint exit=$rc"
          cat /tmp/main-lint.errors

      - name: Checkout exact Lane 11 candidate
        uses: actions/checkout@v4
        with:
          ref: 86f2eba4a9951db8702331bccc821684bfbd4634
          fetch-depth: 0

      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "86f2eba4a9951db8702331bccc821684bfbd4634"
          git status --short --branch
          git diff --check 12e2b91eace6b7587b85c32ea25749f4baf0a2cc HEAD

      - name: Install candidate dependencies
        run: npm ci

      - name: Focused Lane 11 tests
        run: |
          npx vitest run \
            tests/governedSourceSelection.test.ts \
            tests/wikipediaFrontierCapture.test.ts \
            tests/wikipediaSessionPersistence.test.ts \
            tests/wikipediaCaptureAuthoringBoundary.test.ts \
            tests/draftFromSourceButton.test.ts

      - name: Full test suite
        run: npm test

      - name: TypeScript differential gate
        run: |
          set +e
          npm run lint > /tmp/candidate-lint.log 2>&1
          rc=$?
          set -e
          grep -E 'error TS[0-9]+:' /tmp/candidate-lint.log | sort > /tmp/candidate-lint.errors || true
          echo "main lint exit=$(cat /tmp/main-lint.rc); candidate lint exit=$rc"
          echo "Candidate diagnostics:"
          cat /tmp/candidate-lint.errors
          new_diagnostics="$(comm -13 /tmp/main-lint.errors /tmp/candidate-lint.errors)"
          if [ -n "$new_diagnostics" ]; then
            echo "Lane 11 introduces new TypeScript diagnostics:" >&2
            printf '%s\n' "$new_diagnostics" >&2
            exit 1
          fi
          removed_diagnostics="$(comm -23 /tmp/main-lint.errors /tmp/candidate-lint.errors)"
          if [ -n "$removed_diagnostics" ]; then
            echo "Lane 11 removes baseline TypeScript diagnostics:"
            printf '%s\n' "$removed_diagnostics"
          fi
          echo "Lane 11 introduces zero TypeScript diagnostics beyond main baseline."

      - name: Authoring-dev build gate
        run: npm run build:authoring-dev

      - name: Inspect built manifest
        run: |
          test -f dist/manifest.json
          node -e 'const m=require("./dist/manifest.json"); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version, m.manifest_version)'

      - name: Real Chrome process-restart recovery probe
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version

          cat > dist/lifecycle-probe.html <<'EOF'
          <!doctype html>
          <html><body>PENDING<script type="module" src="lifecycle-probe.js"></script></body></html>
          EOF

          cat > dist/lifecycle-probe.js <<'EOF'
          const KEY = "counterpedia_governed_source_selection_v0_1";
          const digest = "sha256:" + "a".repeat(64);
          const source = {
            tool: "acquisition.capture_url",
            surface_schema: "acquisition.mcp_surface.v0.1",
            capture_status: "captured",
            capture_id: "cap_restart_probe",
            source_id: "src_restart_probe",
            source_locator: "https://example.org/restart-proof",
            captured_object_address: digest,
            byte_count: 123,
            failure_detail: null,
            capture_receipt: {
              capture_id: "cap_restart_probe",
              source_id: "src_restart_probe",
              source_locator: "https://example.org/restart-proof",
              exact_bytes_sha256: digest,
              byte_count: 123
            }
          };
          const mode = new URL(location.href).searchParams.get("mode");
          if (mode === "write") {
            await chrome.storage.local.set({
              [KEY]: {
                schema_version: "counterpedia.governed_source_selection.v0.1",
                selected_at: "2026-08-19T02:00:00.000Z",
                source,
                retention: "LOCAL_ONLY",
                authority_posture: "selection_only"
              }
            });
            document.body.textContent = "WRITE_OK";
          } else if (mode === "read") {
            const stored = (await chrome.storage.local.get(KEY))[KEY];
            document.body.textContent = stored?.source?.capture_id === "cap_restart_probe" ? "READ_OK" : "READ_FAILED";
          } else {
            document.body.textContent = "UNKNOWN_MODE";
          }
          EOF

          PROFILE="$RUNNER_TEMP/lane11-chrome-profile"
          DIST="$GITHUB_WORKSPACE/dist"
          rm -rf "$PROFILE"
          mkdir -p "$PROFILE"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$PROFILE" \
            --disable-extensions-except="$DIST" \
            --load-extension="$DIST" \
            about:blank > /tmp/lane11-register.log 2>&1 &
          chrome_pid=$!
          sleep 4
          kill -TERM "$chrome_pid" || true
          wait "$chrome_pid" || true

          PREFS="$PROFILE/Default/Preferences"
          test -f "$PREFS"
          EXT_ID="$(python - "$PREFS" "$DIST" <<'PY'
          import json, os, sys
          prefs_path, dist = sys.argv[1], os.path.realpath(sys.argv[2])
          with open(prefs_path, encoding='utf-8') as fh:
              prefs = json.load(fh)
          settings = prefs.get('extensions', {}).get('settings', {})
          for ext_id, cfg in settings.items():
              path = cfg.get('path') if isinstance(cfg, dict) else None
              if path and os.path.realpath(path) == dist:
                  print(ext_id)
                  break
          else:
              print('unpacked extension id not found in Preferences', file=sys.stderr)
              print(json.dumps(settings, indent=2)[:12000], file=sys.stderr)
              raise SystemExit(1)
          PY
          )"
          test -n "$EXT_ID"
          echo "Loaded extension id: $EXT_ID"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$PROFILE" \
            --disable-extensions-except="$DIST" \
            --load-extension="$DIST" \
            --virtual-time-budget=3000 \
            --dump-dom "chrome-extension://$EXT_ID/lifecycle-probe.html?mode=write" > /tmp/lane11-write.html
          grep -F "WRITE_OK" /tmp/lane11-write.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$PROFILE" \
            --disable-extensions-except="$DIST" \
            --load-extension="$DIST" \
            --virtual-time-budget=3000 \
            --dump-dom "chrome-extension://$EXT_ID/lifecycle-probe.html?mode=read" > /tmp/lane11-read.html
          grep -F "READ_OK" /tmp/lane11-read.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$PROFILE" \
            --disable-extensions-except="$DIST" \
            --load-extension="$DIST" \
            --virtual-time-budget=5000 \
            --dump-dom "chrome-extension://$EXT_ID/panel/index.html" > /tmp/lane11-panel.html
          grep -F "Draft-source selection recovered locally · cap_restart_probe" /tmp/lane11-panel.html
          echo "Real Chrome restart recovery probe passed."
