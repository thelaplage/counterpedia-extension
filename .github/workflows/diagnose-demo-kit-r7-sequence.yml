name: diagnose-demo-kit-r7-sequence

on:
  push:
    branches:
      - verify/demo-kit-r7-recut0

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:authoring-dev
      - run: npm run demo:kit:test
      - run: npx vitest run tests/wikipediaHarvestBridge.test.ts tests/wikipediaLocalCompanionContract.test.ts tests/wikipediaE2EClosure.test.ts
      - name: Full regression after ordered gates
        id: regression
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee ordered-npm-test.log
      - name: Readiness
        id: readiness
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 tools/counterpedia-local/test_preflight.py
            python3 tools/counterpedia-local/test_preflight_non_object_payload.py
            python3 -m py_compile tools/counterpedia-local/counterpedia_local.py
          } 2>&1 | tee ordered-readiness.log
      - name: Verdict
        run: printf 'regression=%s\nreadiness=%s\n' '${{ steps.regression.outcome }}' '${{ steps.readiness.outcome }}' | tee verdict.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-kit-r7-ordered-diagnostics
          path: |
            ordered-npm-test.log
            ordered-readiness.log
            verdict.txt
          if-no-files-found: error
          retention-days: 2
