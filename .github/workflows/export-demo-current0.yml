name: export-demo-current0-extension

on:
  push:
    branches:
      - tmp/export-demo-current0-extension

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source pin
        uses: actions/checkout@v4
        with:
          ref: d392e6e214f712296c8fde75e05c6ee68cdb363e
          path: source
          fetch-depth: 1
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "d392e6e214f712296c8fde75e05c6ee68cdb363e"
          tar -C source -czf repo-source.tar.gz .
          sha256sum repo-source.tar.gz > repo-source.tar.gz.sha256
      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: demo-current0-extension-source
          path: |
            repo-source.tar.gz
            repo-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
