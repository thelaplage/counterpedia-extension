name: Reader consumer extension exact regression proof

on:
  push:
    branches:
      - proof/reader-consumer-ext1-regression0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact #61 head
        uses: actions/checkout@v4
        with:
          ref: 2203aa087d61391566d43b473baa2aa209134363

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "2203aa087d61391566d43b473baa2aa209134363"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ordinary extension tests
        run: npm test

      - name: Typecheck exact head
        run: npm run lint

      - name: Build authoring-dev extension
        run: npm run build:authoring-dev
