name: verify-check-healthz-contract1-shape1

on:
  push:
    branches:
      - verify/check-healthz-contract1-shape1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact product-head guard
        run: |
          PRODUCT="ec1ef90f991c82d21849668c110bd4418c4a869f"
          git cat-file -e "$PRODUCT^{commit}"
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test "$(git diff --name-only "$PRODUCT"...HEAD)" = ".github/workflows/verify-check-healthz-contract1-shape1.yml"
      - name: Python syntax
        run: |
          python -m py_compile tools/counterpedia-local/preflight.py tools/counterpedia-local/test_preflight.py tools/counterpedia-local/test_preflight_non_object_payload.py
      - name: Existing preflight suite
        run: python tools/counterpedia-local/test_preflight.py -v
      - name: Non-object hostile regression
        run: python tools/counterpedia-local/test_preflight_non_object_payload.py -v
      - name: Diff whitespace
        run: git diff --check ec1ef90f991c82d21849668c110bd4418c4a869f...HEAD
