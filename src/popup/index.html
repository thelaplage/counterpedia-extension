<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counterpedia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
      width: 260px;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #1648c7;
    }
  </style>
</head>
<body>
  <h1>Counterpedia</h1>
  <p>Find governed records matching the current page.</p>
  <button id="open-panel">Open Side Panel</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
